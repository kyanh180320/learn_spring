spring.application.name=learn_spring

# Datasource Configuration (PostgreSQL Local)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=kyanh
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / SpringDoc Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 1. THÊM DÒNG NÀY: Để Hibernate in giá trị thực tế gắn vào dấu ?
logging.level.org.hibernate.orm.jdbc.bind=trace

# 2. THÊM DÒNG NÀY: Tắt OSIV để sửa cảnh báo (WARN) lúc startup ứng dụng
spring.jpa.open-in-view=false